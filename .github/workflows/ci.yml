name: ci

on:
  push:
  pull_request:

jobs:
  cpu-build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DGFSS_ENABLE_CUDA=OFF -DGFSS_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke CLI
        run: ./build/gfss estimate 16 8 8
